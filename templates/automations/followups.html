{% extends "base.html" %}{% block content %}<h1>Scheduled follow-ups</h1><div class="card p-3 border-0 shadow-sm mb-4"><form method="post">{% csrf_token %}<label class="form-label">Inquiry</label><select name="inquiry_id" class="form-select mb-3" required>{% for i in inquiries %}<option value="{{ i.pk }}">{{ i.subject }} — {{ i.customer.email }}</option>{% endfor %}</select><button class="btn btn-primary">Schedule in 3 days</button></form></div><div class="card p-3 border-0 shadow-sm table-responsive"><table class="table"><thead><tr><th>Inquiry</th><th>Due</th><th>Status</th></tr></thead><tbody>{% for f in followups %}<tr><td>{{ f.inquiry.subject }}</td><td>{{ f.due_at|date:"d M Y H:i" }}</td><td>{{ f.get_status_display }}</td></tr>{% empty %}<tr><td colspan="3">No follow-ups scheduled.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
