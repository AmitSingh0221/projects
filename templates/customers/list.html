{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h1>Customers</h1><a class="btn btn-primary" href="{% url 'customer_create' %}">Add customer</a></div><form class="mb-3"><div class="input-group"><input class="form-control" name="q" value="{{ q }}" placeholder="Search name, email or company"><button class="btn btn-outline-secondary">Search</button></div></form><div class="card border-0 shadow-sm p-3 table-responsive"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Phone</th><th>Actions</th></tr></thead><tbody>{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.email }}</td><td>{{ c.company|default:"—" }}</td><td>{{ c.phone|default:"—" }}</td><td><a href="{% url 'customer_update' c.pk %}">Edit</a> · <a href="{% url 'customer_delete' c.pk %}">Delete</a></td></tr>{% empty %}<tr><td colspan="5">No customers found.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
