{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-5"><div class="card p-4 shadow-sm border-0"><h2>Sign in</h2>{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div><div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div><button class="btn btn-primary w-100">Sign in</button></form></div></div></div><script>document.querySelectorAll('input').forEach(x=>x.classList.add('form-control'))</script>{% endblock %}
